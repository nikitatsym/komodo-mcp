[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "komodo-mcp"
version = "1.0.0"
description = "MCP server for Komodo — full API coverage for autonomous agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3",
    "httpx>=0.27.0",
    "pydantic-settings>=2.0",
]
keywords = ["mcp", "komodo", "docker", "deployment", "server-management", "model-context-protocol", "claude", "ai"]

[project.scripts]
komodo-mcp = "komodo_mcp:main"

[project.urls]
Homepage = "https://github.com/nikitatsym/komodo-mcp"
Repository = "https://github.com/nikitatsym/komodo-mcp"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "mypy>=1.10",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
markers = ["integration: requires a live Komodo Docker Compose stack"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
# codegen/generate.ts owns this file; linting it would demand hand-edits the
# next regeneration throws away.
extend-exclude = ["src/komodo_mcp/_generated.py"]

[tool.ruff.lint]

[tool.ruff.lint.isort]
# Keep aliased names grouped with their module instead of exploding one
# `from X import a as b` statement per alias (mirrors gitlab-mcp).
combine-as-imports = true

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = "komodo_mcp.tools"
# Overrides shadow names re-exported by `from ._generated import *`. The
# shadowing is intentional (override > generated by design).
disable_error_code = ["no-redef"]
